name: Check source and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, official release verified 2026-10-26
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, official release verified 2026-10-26
        with:
          python-version: '3.13'
      - run: python -B tools/build.py --check
      - run: python -B -m unittest discover -s tests -v
      - run: python -B tools/build.py --output dist/ci
      - run: python -B tools/build.py --verify dist/ci
      - run: python -B tools/preflight.py --build dist/ci --output dist/preflight.json
